<!doctype html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>幸運抽籤</title>
	<style>
		:root{--ink:#17212b;--muted:#6d7884;--orange:#ff7043;--teal:#0f8b8d;--line:#dfe4e8}
		*{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:radial-gradient(circle at 8% 12%,#ffbe5c70 0 7%,transparent 7.2%),radial-gradient(circle at 90% 88%,#0f8b8d30 0 13%,transparent 13.2%),linear-gradient(135deg,#fff8e8,#fffdf8 48%,#eef9f5)}
		.page{width:min(1100px,calc(100% - 32px));margin:auto;padding:48px 0 56px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.eyebrow{color:#dc4f27;font-size:.78rem;font-weight:800;letter-spacing:.18em}h1{margin:8px 0 0;font-size:clamp(2.3rem,6vw,4.7rem);line-height:.96;letter-spacing:-.06em}.intro{max-width:360px;margin:0;color:var(--muted);line-height:1.7;text-align:right}.app{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(360px,1.2fr);gap:22px}.panel{padding:28px;border:1px solid #ffffffd9;border-radius:22px;background:#ffffffc7;box-shadow:0 24px 70px #25323a24;backdrop-filter:blur(12px)}.panel h2{margin:0 0 18px;font-size:1.15rem}label{display:block;margin-bottom:9px;color:var(--muted);font-size:.88rem;font-weight:700}textarea{display:block;width:100%;min-height:270px;resize:vertical;padding:16px;border:1px solid var(--line);border-radius:14px;outline:0;color:var(--ink);background:#fffdf8;font:inherit;line-height:1.8}textarea:focus{border-color:var(--teal);box-shadow:0 0 0 4px #0f8b8d1f}.helper{margin:10px 0 0;color:var(--muted);font-size:.82rem}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}button{border:0;border-radius:11px;padding:12px 17px;color:var(--ink);background:#edf0f0;font:inherit;font-weight:800;cursor:pointer;transition:.18s}button:hover{transform:translateY(-2px);box-shadow:0 8px 18px #17212b1a}.primary{flex:1;min-width:150px;color:#fff;background:var(--orange);box-shadow:0 10px 22px #ff704340}.primary:hover{background:#dc4f27}.secondary{color:var(--teal);background:#e5f5f2}.result-panel{display:flex;min-height:100%;flex-direction:column}.result-box{display:grid;min-height:235px;place-items:center;margin-bottom:20px;padding:24px;border-radius:17px;color:#fff;text-align:center;background:var(--ink);overflow:hidden}.result-label{color:#9de1d5;font-size:.8rem;letter-spacing:.15em}#result{margin:12px 0 0;font-size:clamp(2.6rem,7vw,5rem);letter-spacing:-.06em;line-height:1.1;overflow-wrap:anywhere}.stats{display:flex;gap:10px;margin-bottom:25px}.stat{flex:1;padding:13px 15px;border-radius:12px;background:#f3f5f3}.stat strong{display:block;font-size:1.45rem}.stat span{color:var(--muted);font-size:.78rem}.history-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.history-title h2{margin:0}#clearHistory{padding:5px 8px;color:var(--muted);background:transparent;font-size:.78rem}#history{display:flex;min-height:32px;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}#history li{padding:7px 11px;border-radius:999px;color:var(--teal);background:#e5f5f2;font-size:.85rem;font-weight:700}.empty{color:var(--muted);font-size:.85rem}.drawing #result{animation:pulse .9s ease infinite alternate}@keyframes pulse{from{opacity:.35;transform:scale(.96)}to{opacity:1;transform:scale(1.03)}}@media(max-width:760px){.page{padding-top:30px}header{display:block}.intro{margin-top:14px;text-align:left}.app{grid-template-columns:1fr}.panel{padding:20px}}
	</style>
</head>
<body>
	<main class="page">
		<header><div><div class="eyebrow">LUCKY DRAW / 01</div><h1>今天，誰最幸運？</h1></div><p class="intro">把名字放進名單，按下抽籤，讓一點點隨機替你做決定。</p></header>
		<section class="app" aria-label="抽籤工具">
			<section class="panel"><h2>參加名單</h2><label for="names">每行輸入一個名字</label><textarea id="names" placeholder="例如：&#10;小明&#10;小華&#10;阿美&#10;小志"></textarea><p class="helper">目前名單：<strong id="participantCount">0</strong> 人</p><div class="actions"><button class="secondary" id="sampleButton" type="button">填入範例</button><button class="primary" id="drawButton" type="button">開始抽籤</button></div></section>
			<section class="panel result-panel"><div class="result-box" id="resultBox"><div><div class="result-label">RESULT</div><div id="result">準備好了嗎？</div></div></div><div class="stats"><div class="stat"><strong id="remainingCount">0</strong><span>尚未抽出</span></div><div class="stat"><strong id="drawnCount">0</strong><span>已抽出</span></div></div><div class="history-title"><h2>抽籤紀錄</h2><button id="clearHistory" type="button">清除紀錄</button></div><ul id="history"><li class="empty">還沒有抽籤紀錄</li></ul></section>
		</section>
	</main>
	<script>
		const input=document.querySelector('#names'), result=document.querySelector('#result'), box=document.querySelector('#resultBox'), count=document.querySelector('#participantCount'), remainingEl=document.querySelector('#remainingCount'), drawnEl=document.querySelector('#drawnCount'), history=document.querySelector('#history');
		let remaining=[], drawn=[];
		const getNames=()=>input.value.split('\n').map(name=>name.trim()).filter(Boolean).filter((name,index,list)=>list.indexOf(name)===index);
		function update(){count.textContent=getNames().length;remainingEl.textContent=remaining.length;drawnEl.textContent=drawn.length}
		function reset(){remaining=getNames();drawn=[];result.textContent='準備好了嗎？';history.innerHTML='<li class="empty">還沒有抽籤紀錄</li>';update()}
		input.addEventListener('input',reset);
		document.querySelector('#sampleButton').addEventListener('click',()=>{input.value='小明\n小華\n阿美\n小志\n安安';reset()});
		document.querySelector('#drawButton').addEventListener('click',()=>{
			if(!remaining.length)reset(); if(!remaining.length){result.textContent='請先輸入名單';return}
			box.classList.add('drawing');let ticks=0;const timer=setInterval(()=>{result.textContent=remaining[Math.floor(Math.random()*remaining.length)];if(++ticks<9)return;clearInterval(timer);const winner=remaining.splice(Math.floor(Math.random()*remaining.length),1)[0];drawn.push(winner);result.textContent=winner;box.classList.remove('drawing');if(history.querySelector('.empty'))history.innerHTML='';const item=document.createElement('li');item.textContent=winner;history.prepend(item);update()},90)
		});
		document.querySelector('#clearHistory').addEventListener('click',reset);update();
	</script>
</body>
</html>
